name: chateau_mobile_app
description: "HOA APP for Chateau."
publish_to: 'none'
version: 3.0.2+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase & auth
  supabase_flutter: ^2.5.0

  # Media
  image_picker: ^1.1.2
  panorama_viewer: ^2.0.7
  video_player: ^2.9.2

  # Calendar
  table_calendar: ^3.2.0

  # Map — flutter_map + Mapbox raster tiles / directions over http
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # Location
  geolocator: ^12.0.0

  # Network
  http: ^1.2.0
  url_launcher: ^6.3.0

  # Statement of Account — generates a PDF matching the website's design
  pdf: ^3.11.1
  printing: ^5.13.4

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
