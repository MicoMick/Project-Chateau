      <text x="84" y="571" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Payment Success</text>
      <text x="84" y="586" font-family="Arial, sans-serif" font-size="8.5" fill="#94a3b8">2026-09-09 5:13 PM</text>
