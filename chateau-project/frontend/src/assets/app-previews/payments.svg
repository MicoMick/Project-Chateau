    <text x="42" y="216" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Total Amount Due</text>
    <text x="278" y="218" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="end">₱ 0.00</text>

    <rect x="42" y="238" width="236" height="42" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>
    <text x="160" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">View Bill</text>

    <text x="160" y="304" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">📅  Pay in Advance</text>

    <!-- transaction history -->
    <rect x="20" y="378" width="4" height="16" fill="#006837"/>
    <text x="32" y="391" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Transaction History</text>

    <!-- unpaid row -->
    <rect x="20" y="404" width="280" height="66" rx="16" fill="#ffffff"/>
    <rect x="34" y="418" width="38" height="38" rx="10" fill="#fde3e3"/>
    <text x="53" y="442" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">🧾</text>
    <text x="84" y="432" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Monthly Due</text>
