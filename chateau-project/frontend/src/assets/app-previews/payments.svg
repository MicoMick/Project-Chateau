    <text x="42" y="122" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Jake Viking A. De la Cruz</text>
    <line x1="42" y1="140" x2="278" y2="140" stroke="#ffffff" stroke-opacity="0.25"/>

    <text x="42" y="168" font-family="Arial, sans-serif" font-size="11" fill="#cdeadb">Monthly Fee</text>
