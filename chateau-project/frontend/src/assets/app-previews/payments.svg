    <g>
      <rect x="20" y="478" width="280" height="60" rx="16" fill="#ffffff"/>
      <circle cx="53" cy="508" r="19" fill="#e2f2e8"/>
      <path d="M45 508 l6 6 l12 -12" fill="none" stroke="#006837" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="503" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Payment Success</text>
      <text x="84" y="518" font-family="Arial, sans-serif" font-size="8.5" fill="#94a3b8">2026-09-09 5:13 PM</text>
      <text x="284" y="503" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#006837" text-anchor="end">₱150.00</text>
      <rect x="252" y="510" width="32" height="18" rx="9" fill="#e2f2e8"/>
      <text x="268" y="522" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#006837" text-anchor="middle">Paid</text>
