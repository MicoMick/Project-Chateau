    <text x="284" y="432" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#dc2626" text-anchor="end">₱150.00</text>
    <rect x="238" y="440" width="46" height="18" rx="9" fill="#fde3e3"/>
    <text x="261" y="452" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#dc2626" text-anchor="middle">Unpaid</text>

