<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="320" height="640" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="320" height="640" fill="#f3f6f2"/>

    <!-- top bar -->
    <rect x="20" y="22" width="14" height="14" rx="3" fill="#006837"/>
    <rect x="38" y="22" width="14" height="14" rx="3" fill="#006837"/>
    <rect x="20" y="40" width="14" height="14" rx="3" fill="#006837"/>
    <rect x="38" y="40" width="14" height="14" rx="3" fill="#006837"/>
    <ellipse cx="160" cy="38" rx="62" ry="22" fill="#FFF200" stroke="#006837" stroke-width="2"/>
    <text x="160" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#7a2f19" text-anchor="middle">CHATEAU REAL</text>
    <text x="160" y="47" font-family="Arial, sans-serif" font-size="6" fill="#7a2f19" text-anchor="middle">at METROPOLIS</text>
    <path d="M292 26 a10 10 0 0 1 10 10 v6 l4 6 h-28 l4-6 v-6 a10 10 0 0 1 10-10 z" fill="#006837"/>

    <!-- account balance card -->
    <rect x="20" y="72" width="280" height="120" rx="22" fill="#006837"/>
    <text x="42" y="104" font-family="Arial, sans-serif" font-size="12" fill="#bfe3cf">Account Balance</text>
    <text x="42" y="140" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff">₱ 0.00</text>
    <rect x="42" y="156" width="118" height="22" rx="11" fill="#ffffff" fill-opacity="0.18"/>
    <text x="101" y="171" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">No dues pending ✓</text>
    <circle cx="262" cy="132" r="24" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="250" y="122" width="24" height="18" rx="4" fill="#ffffff"/>
    <circle cx="266" cy="131" r="3" fill="#006837"/>

    <!-- HOA calendar header -->
    <rect x="20" y="210" width="4" height="16" fill="#006837"/>
    <text x="32" y="223" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">HOA Calendar</text>
    <g font-family="Arial, sans-serif" font-size="8" fill="#64748b">
      <circle cx="24" cy="240" r="3" fill="#0f172a"/><text x="30" y="243">General</text>
      <circle cx="86" cy="240" r="3" fill="#006837"/><text x="92" y="243">Financial</text>
      <circle cx="150" cy="240" r="3" fill="#2563eb"/><text x="156" y="243">Event</text>
      <circle cx="200" cy="240" r="3" fill="#ea580c"/><text x="206" y="243">Maintenance</text>
      <circle cx="272" cy="240" r="3" fill="#dc2626"/><text x="278" y="243">Election</text>
    </g>

    <!-- calendar card -->
    <rect x="20" y="256" width="280" height="330" rx="20" fill="#ffffff"/>
    <text x="106" y="284" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">September 2026</text>
    <text x="40" y="286" font-family="Arial, sans-serif" font-size="16" fill="#006837">‹</text>
    <text x="278" y="286" font-family="Arial, sans-serif" font-size="16" fill="#006837">›</text>
    <g font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      <text x="52" y="304">Sun</text><text x="92" y="304">Mon</text><text x="132" y="304">Tue</text>
      <text x="172" y="304">Wed</text><text x="212" y="304">Thu</text><text x="252" y="304">Fri</text><text x="288" y="304">Sat</text>
    </g>
    <!-- day grid, simplified: 5 rows of circles with dots -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">
      <!-- generate rows programmatically-ish, manually laid out -->
      <!-- row1 -->
      <circle cx="52" cy="330" r="14" fill="none" stroke="#006837" stroke-opacity="0.35"/><text x="52" y="334">1</text><circle cx="52" cy="346" r="1.6" fill="#006837"/>
      <circle cx="92" cy="330" r="14" fill="none" stroke="#006837" stroke-opacity="0.35"/><text x="92" y="334">2</text><circle cx="92" cy="346" r="1.6" fill="#006837"/>
      <circle cx="132" cy="330" r="14" fill="none" stroke="#006837" stroke-opacity="0.35"/><text x="132" y="334">3</text><circle cx="132" cy="346" r="1.6" fill="#006837"/>
      <circle cx="172" cy="330" r="14" fill="#006837" fill-opacity="0.12" stroke="#006837" stroke-opacity="0.35"/><text x="172" y="334">4</text>
      <circle cx="212" cy="330" r="14" fill="#e2f2e8"/><text x="212" y="334" font-weight="800">10</text>
      <circle cx="252" cy="330" r="14" fill="none" stroke="#006837" stroke-opacity="0.35"/><text x="252" y="334">11</text><circle cx="252" cy="346" r="1.6" fill="#006837"/>
      <circle cx="288" cy="330" r="14" fill="none" stroke="#006837" stroke-opacity="0.35"/><text x="288" y="334">12</text><circle cx="288" cy="346" r="1.6" fill="#006837"/>
    </g>
    <text x="26" y="400" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">···</text>

    <!-- announcements section -->
    <rect x="20" y="428" width="4" height="16" fill="#006837"/>
    <text x="32" y="441" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Announcements</text>
    <rect x="20" y="454" width="280" height="60" rx="16" fill="#ffffff"/>
    <rect x="36" y="466" width="66" height="20" rx="10" fill="#e2f2e8" stroke="#006837" stroke-opacity="0.3"/>
    <text x="69" y="480" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#006837" text-anchor="middle">FINANCIAL</text>
    <text x="284" y="480" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="end">Sep 1, 2026</text>

    <!-- bottom nav -->
    <rect x="0" y="576" width="320" height="64" fill="#ffffff"/>
    <line x1="0" y1="576" x2="320" y2="576" stroke="#e2e8f0"/>
    <g font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      <text x="52" y="618" fill="#006837" font-weight="800">Home</text>
      <text x="136" y="618">Report</text>
      <text x="204" y="618">Map</text>
      <text x="272" y="618">Reserve</text>
    </g>
    <rect x="36" y="592" width="32" height="4" rx="2" fill="#006837"/>
  </g>
</svg>
