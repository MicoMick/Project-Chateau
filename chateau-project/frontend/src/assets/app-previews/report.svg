    <text x="160" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#7a2f19" text-anchor="middle">CHATEAU REAL</text>
    <path d="M292 26 a10 10 0 0 1 10 10 v6 l4 6 h-28 l4-6 v-6 a10 10 0 0 1 10-10 z" fill="#006837"/>

