    <text x="20" y="138" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Category</text>

    <!-- category grid -->
    <g font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
