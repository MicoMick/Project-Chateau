<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640">
  <defs><clipPath id="frame"><rect x="0" y="0" width="320" height="640" rx="28"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="320" height="640" fill="#f3f6f2"/>

    <rect x="20" y="22" width="14" height="14" rx="3" fill="#006837"/>
    <rect x="38" y="22" width="14" height="14" rx="3" fill="#006837"/>
    <rect x="20" y="40" width="14" height="14" rx="3" fill="#006837"/>
    <rect x="38" y="40" width="14" height="14" rx="3" fill="#006837"/>
