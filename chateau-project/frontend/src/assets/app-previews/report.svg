      <text x="136" y="618" fill="#006837" font-weight="800">Report</text>
      <text x="204" y="618">Map</text>
      <text x="272" y="618">Reserve</text>
    </g>
    <rect x="120" y="592" width="32" height="4" rx="2" fill="#006837"/>
