      <text x="63" y="192" font-size="22">🔧</text>
      <text x="63" y="220" fill="#c2410c">Maintenance</text>

      <rect x="116" y="148" width="86" height="86" rx="18" fill="#ffffff"/>
      <text x="159" y="192" font-size="22">🔇</text>
      <text x="159" y="220" fill="#94a3b8">Noise</text>

      <rect x="212" y="148" width="86" height="86" rx="18" fill="#ffffff"/>
      <text x="255" y="192" font-size="22">🗑️</text>
      <text x="255" y="220" fill="#94a3b8">Cleanliness</text>

      <rect x="20" y="242" width="86" height="86" rx="18" fill="#ffffff"/>
      <text x="63" y="286" font-size="22">🛡️</text>
      <text x="63" y="314" fill="#94a3b8">Security</text>

      <rect x="116" y="242" width="86" height="86" rx="18" fill="#ffffff"/>
      <text x="159" y="286" font-size="22">🚦</text>
      <text x="159" y="314" fill="#94a3b8">Roads</text>

      <rect x="212" y="242" width="86" height="86" rx="18" fill="#ffffff"/>
      <text x="255" y="286" font-size="18">•••</text>
      <text x="255" y="314" fill="#94a3b8">Other</text>
    </g>

    <!-- selected category panel -->
    <rect x="20" y="344" width="280" height="270" rx="20" fill="#ffffff"/>
    <rect x="20" y="344" width="280" height="42" rx="20" fill="#fdeee1"/>
    <text x="40" y="370" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#c2410c">🔧 Maintenance</text>

    <text x="38" y="404" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Description</text>
    <rect x="38" y="414" width="244" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="52" y="436" font-family="Arial, sans-serif" font-size="10" fill="#a3adba">Describe the issue in detail…</text>
    <text x="282" y="538" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="end">0/500</text>

    <text x="38" y="562" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Photo / Video (optional)</text>
